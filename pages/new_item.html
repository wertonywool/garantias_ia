<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro | GarantíaPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/new_item.css">
    
    <!-- SDK de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- Configuración y Seguridad -->
    <script src="../js/firebase_config.js"></script>
    <script src="../js/auth_guard.js"></script>
</head>
<body style="display: none;">

    <div class="container">
        <header class="header">
            <a href="inventory.html" class="back-link">← Volver al Inventario</a>
            <div style="text-align: right;">
                <span style="background: var(--primary-soft); color: var(--primary); padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 0.7rem;">MODO MANUAL</span>
            </div>
        </header>

        <div class="form-card" id="formContainer">
            <h2 class="section-title">📦 Datos del Activo</h2>
            
            <form id="newProductForm">
                <div class="grid">
                    <div class="form-group full-width">
                        <label>Fotografía del producto</label>
                        <div class="image-upload-zone" id="dropZone">
                            <div class="upload-placeholder" id="placeholder">
                                <span style="font-size: 2rem;">📸</span>
                                <p>Haz clic para subir o busca en la web</p>
                            </div>
                            <img id="imgPreview" src="" alt="Preview" style="display:none; width: 100%; border-radius: 12px;">
                            <button type="button" id="btnSearchImage" class="btn-search-img">🔍 Buscar Imagen Real</button>
                        </div>
                        <input type="file" id="fileInput" hidden accept="image/*">
                        <input type="hidden" id="imageUrl">
                    </div>

                    <div class="form-group full-width">
                        <label>Nombre del activo</label>
                        <input type="text" id="name" placeholder="Ej: PlayStation 5 Slim" required>
                    </div>

                    <div class="form-group">
                        <label>Marca</label>
                        <input type="text" id="brand" placeholder="Ej: Sony" required>
                    </div>

                    <div class="form-group">
                        <label>Precio de compra ($)</label>
                        <input type="number" id="price" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Fecha de adquisición</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label>Garantía (Meses)</label>
                        <input type="number" id="months" placeholder="12" required>
                        <p class="hint">Suma fabricante + extendida</p>
                    </div>

                    <div class="form-group full-width">
                        <label>Número de Serie / IMEI (Opcional)</label>
                        <input type="text" id="serial" placeholder="SN-XXXX-XXXX-XXXX">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span>🚀</span> Guardar y Generar Plan IA
                </button>
            </form>
        </div>

        <!-- Pantalla de carga/procesamiento IA -->
        <div id="aiLoading" style="display: none; text-align: center; padding: 4rem;">
            <div class="loader" style="margin: 0 auto 2rem;"></div>
            <h3>🧠 El Cerebro IA está analizando tu equipo...</h3>
            <p>Generando plan de mantenimiento preventivo personalizado.</p>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/new_item.js"></script>
</body>
</html>
